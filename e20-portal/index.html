<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E20 Vehicle Protection Portal – Student Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7fc;--card:#fff;--ink:#101a2e;--mut:#64748b;--line:#e3e9f3;--pri:#0fb58a;--pri2:#0a8f6c;--soft:#e3f8f1;--vio:#7c5cff;--cor:#ff6b6b;--sun:#ffb020;--sky:#2bb8ff;--bad:#e5484d;--ok:#16a36a;--warn:#c27803;--glass:rgba(255,255,255,.72);--sh:0 8px 30px rgba(16,26,46,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#131c31;--ink:#e8eefc;--mut:#8fa0c0;--line:#223052;--pri:#2fd8aa;--pri2:#6ee7c5;--soft:#12332f;--vio:#9b84ff;--cor:#ff8585;--sun:#ffc457;--sky:#5cc9ff;--bad:#ff7b80;--ok:#4be09b;--warn:#ffbe55;--glass:rgba(19,28,49,.72);--sh:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#131c31;--ink:#e8eefc;--mut:#8fa0c0;--line:#223052;--pri:#2fd8aa;--pri2:#6ee7c5;--soft:#12332f;--vio:#9b84ff;--cor:#ff8585;--sun:#ffc457;--sky:#5cc9ff;--bad:#ff7b80;--ok:#4be09b;--warn:#ffbe55;--glass:rgba(19,28,49,.72);--sh:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);height:100%;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:42vw;height:42vw;border-radius:50%;filter:blur(80px);opacity:.28;animation:fl 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:var(--pri);top:-12vw;left:-10vw}.blobs i:nth-child(2){background:var(--vio);right:-12vw;top:20vh;animation-delay:-6s}.blobs i:nth-child(3){background:var(--sun);bottom:-16vw;left:25vw;animation-delay:-12s;opacity:.18}
@keyframes fl{to{transform:translate(6vw,5vh) scale(1.15)}}
#sp{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--pri),var(--vio),var(--cor));z-index:30}
.demo{background:linear-gradient(90deg,var(--sun),var(--cor));color:#2a1200;text-align:center;font-size:12.5px;padding:6px 12px;font-weight:700}
header{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:11;transition:box-shadow .3s}
header.sc{box-shadow:var(--sh)}
.bar{max-width:1120px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--sky));display:grid;place-items:center;font-style:normal;font-size:17px;box-shadow:0 4px 14px rgba(15,181,138,.4)}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:7px 13px;border-radius:99px;color:var(--mut);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;transition:all .2s}
nav a.on{background:var(--soft);color:var(--pri2)}nav a:hover{color:var(--pri2);transform:translateY(-2px)}
#who{display:flex;gap:8px;align-items:center}
.tg{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;transition:transform .4s}.tg:hover{transform:rotate(30deg) scale(1.1)}
main{max-width:1120px;margin:auto;padding:22px 16px 70px}
.pg{animation:pg .5s cubic-bezier(.2,.7,.2,1)}@keyframes pg{from{opacity:0;transform:translateY(12px)}}
h1{font-size:clamp(26px,5vw,40px);line-height:1.12;margin:0 0 8px;letter-spacing:-.8px;font-weight:800}
h2{font-size:19px;margin:0 0 12px;font-weight:800}h3{margin:0 0 6px;font-size:16px}p{margin:0 0 10px}.mut{color:var(--mut);font-size:14px}
.hero{position:relative;background:linear-gradient(135deg,var(--soft),var(--card) 60%);border:1px solid var(--line);border-radius:32px;padding:34px;margin-bottom:20px;overflow:hidden;box-shadow:var(--sh)}
.hero h1{background:linear-gradient(90deg,var(--pri2),var(--vio),var(--cor));-webkit-background-clip:text;background-clip:text;color:transparent;max-width:640px}
.hero .fl{position:absolute;right:22px;top:18px;font-size:70px;animation:bob 3s ease-in-out infinite}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s,background .4s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(124,92,255,.16)}
.stat{display:flex;gap:14px;align-items:center}.stat b{font-size:30px;line-height:1;font-weight:800;display:block}.stat span{font-size:13px;color:var(--mut)}
.ib{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.btn{background:linear-gradient(135deg,var(--pri),var(--sky));color:#fff;border:0;border-radius:99px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .18s,box-shadow .18s;box-shadow:0 6px 16px rgba(15,181,138,.3)}
.btn:hover{transform:translateY(-2px) scale(1.04)}.btn:active{transform:scale(.96)}
.btn.alt{background:var(--soft);color:var(--pri2);box-shadow:none}.btn.sm{padding:6px 14px;font-size:13px}.btn.bad{background:var(--cor)}
form{display:grid;gap:12px}.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
label{font-size:13px;font-weight:700;color:var(--mut);display:grid;gap:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 13px;width:100%;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--soft)}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--pri2)}
.pill.bad{background:rgba(229,72,77,.15);color:var(--bad)}.pill.ok{background:rgba(22,163,106,.16);color:var(--ok)}.pill.warn{background:rgba(255,176,32,.2);color:var(--warn)}
.tl{display:flex;margin:16px 0;overflow-x:auto;padding-bottom:6px}
.tl div{flex:1;min-width:92px;text-align:center;font-size:12px;color:var(--mut);position:relative}
.tl div:before{content:"";display:block;width:22px;height:22px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1;transition:background .5s}
.tl div:after{content:"";position:absolute;top:10px;left:50%;width:100%;height:3px;background:var(--line)}.tl div:last-child:after{display:none}
.tl .d{color:var(--ink);font-weight:600}.tl .d:before{background:linear-gradient(135deg,var(--pri),var(--sky))}.tl .d:after{background:var(--pri)}
.tl .c:before{content:"🚗";background:none;width:auto;height:22px;font-size:20px;line-height:22px;animation:drive 1.6s ease-in-out infinite alternate}
@keyframes drive{to{transform:translateX(6px)}}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}tr:hover td{background:var(--soft)}
details{border-bottom:1px solid var(--line);padding:11px 0}summary{cursor:pointer;font-weight:700}details[open] summary{color:var(--pri2)}details p{animation:pg .3s}
.heat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.heat div{border-radius:14px;padding:12px;font-size:13px;font-weight:700;transition:transform .2s}.heat div:hover{transform:scale(1.06)}
.br{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}.br div{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.br i{display:block;height:100%;border-radius:9px;animation:gw 1s cubic-bezier(.2,.7,.2,1)}@keyframes gw{from{width:0!important}}
.draw{stroke-dasharray:1;animation:dr 1.3s ease forwards}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:700;z-index:40;max-width:90%;animation:pg .3s}
.note{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--pri2)}
.warnbox{background:rgba(255,176,32,.16);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--warn);font-weight:700}
.mascot{font-size:56px;animation:bob 2.6s ease-in-out infinite;display:inline-block}@keyframes bob{50%{transform:translateY(-9px) rotate(5deg)}}
.cf{position:fixed;top:-30px;font-size:24px;z-index:50;animation:fall 2.3s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.chip{background:var(--soft);color:var(--pri2);padding:6px 13px;border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}
.tabs{display:flex;gap:6px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.steps{counter-reset:s}.steps .card{position:relative;padding-top:34px}.steps .card:before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:18px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--vio),var(--cor))}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer;font-size:14px}.chk input{width:18px;height:18px;accent-color:var(--pri)}
.prog{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 12px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--sky));border-radius:9px;transition:width .5s}
.adm{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}@media(max-width:780px){.adm{grid-template-columns:1fr}}
.side{background:linear-gradient(170deg,#101a3a,#2d1f6e);color:#fff;border-radius:26px;padding:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:6px}
.side button{all:unset;cursor:pointer;padding:10px 14px;border-radius:14px;font-weight:600;font-size:14px;transition:background .2s,transform .2s;opacity:.85}.side button:hover{background:rgba(255,255,255,.12);transform:translateX(4px)}.side button.on{background:linear-gradient(135deg,var(--pri),var(--vio));opacity:1}
.rv{opacity:0}.rv.in{opacity:1;animation:rise .65s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}.rv.in.nf{animation:none}@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}}
#up{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--vio);color:#fff;font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:20;box-shadow:var(--sh)}#up.on{opacity:1;pointer-events:auto}#up:hover{transform:translateY(-3px)}
.vh{padding:0;min-height:clamp(400px,66vh,600px);display:flex;align-items:flex-end;background:#0a1020}.vh video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vh:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,30,.05) 25%,rgba(8,14,30,.82));pointer-events:none}
.vt{position:relative;z-index:2;padding:34px;color:#fff}.vh h1{background:none;color:#fff;-webkit-text-fill-color:#fff}.vh .mut{color:#dbe5f7}.vh .btn.alt{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px)}
.vm{position:absolute;top:16px;right:16px;z-index:3;border:0;border-radius:99px;padding:8px 14px;background:rgba(10,16,32,.55);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:0 16px 30px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1}}
</style></head><body>
<div id="sp"></div><div class="blobs"><i></i><i></i><i></i></div>
<header id="hd"><div class="bar"><a class="logo" href="#home"><i>⛽</i>E20 Protect</a><nav id="nav"></nav><div id="who"></div><button class="tg" id="tg" onclick="toggleTheme()" aria-label="Toggle dark or light mode"></button></div></header>
<main id="app"></main><footer>A student prototype · Complaints do not prove E20 caused damage; qualified technical assessment is required.</footer>
<button id="up" onclick="scrollTo({top:0})" aria-label="Back to top">↑</button><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NAV=[["home","Dashboard"],["register","Vehicles"],["complaint","Complaint"],["track","Track"],["policy","Policy"],["centres","Centres"],["help","Help"],["admin","Admin"]];
const PROT=["register","complaint","track","admin"];
const STAGES=["Submitted","Document verification","Inspection scheduled","Technical investigation","Decision"];
const CATS=["Reduced mileage","Engine performance concern","Fuel-system concern","Suspected corrosion","Other issue"];
const AREAS=["Chennai","Coimbatore","Madurai","Bengaluru","Hyderabad","Pune","Delhi NCR","Kochi"];
const COL=["#0fb58a","#7c5cff","#ff6b6b","#ffb020","#2bb8ff"];
const CENTRES=[["Greenline Auto Care (demo)","Anna Salai, Chennai","044-0000-0001","Mon–Sat 9:00–18:00"],["Sunrise Motors Service (demo)","RS Puram, Coimbatore","0422-000-0002","Mon–Sat 9:30–17:30"],["Bluewave Garage (demo)","Whitefield, Bengaluru","080-0000-0003","Mon–Sun 8:00–19:00"],["Metro Fuel-Tech Hub (demo)","Hinjewadi, Pune","020-0000-0004","Mon–Fri 9:00–17:00"]];
const DOCS=["Registration certificate","Purchase invoice","Service history / bills","Fuel purchase receipts","Photos of the issue","Odometer photo"];
const S={vehicles:[],complaints:[],fuel:[],adminRequests:[],adminApproved:[],db:null,uid:"local",owner:false,live:false,ready:false,me:null,tab:"cust",mode:"in",atab:"ov",sel:null,next:null,chk:{}};
try{S.me=JSON.parse(localStorage.getItem("e20me"));if(S.me)S.uid=S.me.email;S.chk=JSON.parse(localStorage.getItem("e20chk")||"{}")}catch(e){}
try{const t=localStorage.getItem("e20t");if(t)document.documentElement.dataset.theme=t}catch(e){}
const uid6=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const mine=()=>({v:S.vehicles.filter(x=>x.uid===S.uid),c:S.complaints.filter(x=>x.uid===S.uid)});
function toast(m){const t=$("#toast");t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML="",3300)}

/* ---------- theme ---------- */
const curTheme=()=>document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function toggleTheme(){const n=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("e20t",n)}catch(e){}chrome()}

/* ---------- backend ---------- */
async function save(col,obj){const a=S[col],i=a.findIndex(x=>x.id===obj.id);i<0?a.unshift(obj):a[i]=obj;
  if(S.db){try{await S.db.collection(col).doc(obj.id).set(obj)}catch(e){toast("Saved on this screen only (backend refused the write)")}}render()}
async function del(col,id){S[col]=S[col].filter(x=>x.id!==id);if(S.db){try{await S.db.collection(col).doc(id).delete()}catch(e){toast("Backend refused the change")}}render()}
async function boot(){render();if(!(window.claude&&claude.use))return;
  const t=new Promise(r=>setTimeout(()=>r([null,null]),10000));
  try{const [db,user]=await Promise.race([Promise.all([claude.use("db"),claude.use("user")]),t]);
    if(user){try{S.owner=!!user.canEdit()}catch(e){}}
    if(db){S.db=db;S.live=true;["vehicles","complaints","fuel","adminRequests","adminApproved"].forEach(c=>db.collection(c).onSnapshot(q=>{S[c]=q.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>(b.created||0)-(a.created||0));if(c==="adminApproved")S.ready=true;render()},()=>{}))}
  }catch(e){}render()}

/* ---------- helpers ---------- */
const stat=(n,l,e,c)=>`<div class="card stat">${ib(e,c)}<div><b class="cnt" data-n="${n}">0</b><span>${l}</span></div></div>`;
const ib=(e,c)=>`<span class="ib" style="background:${c}22">${e}</span>`;
const status=c=>c.outcome?(c.outcome==="approved"?'<span class="pill ok">Approved</span>':'<span class="pill bad">Rejected</span>'):'<span class="pill warn">'+STAGES[c.stage]+'</span>';
const timeline=c=>'<div class="tl">'+STAGES.map((s,i)=>'<div class="'+(i<=c.stage?"d ":"")+(i===c.stage&&!c.outcome?"c":"")+'">'+s+'</div>').join("")+'</div>';
const notifs=l=>{const n=[];l.forEach(c=>(c.history||[]).forEach(h=>n.push({t:h.t,m:c.id+": "+h.s+(h.note?" – "+h.note:"")})));return n.sort((a,b)=>b.t-a.t).slice(0,5)};
function donut(d){const T=d.reduce((a,x)=>a+x[1],0),C=2*Math.PI*40;let o=0;return `<svg viewBox="0 0 100 100" width="150" height="150"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="14"/>${T?d.map(x=>{const l=x[1]/T*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${x[2]}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"><title>${x[0]}: ${x[1]}</title></circle>`;o+=l;return s}).join(""):""}<text x="50" y="56" text-anchor="middle" font-size="18" font-weight="800" fill="var(--ink)">${T}</text></svg>`}
function line(p){if(p.length<2)return '<p class="mut">Add at least 2 fill-ups to see your trend.</p>';const w=300,h=110,mx=Math.max(...p),mn=Math.min(...p),r=(mx-mn)||1,P=p.map((v,i)=>[10+i*(w-20)/(p.length-1),h-15-(v-mn)/r*(h-35)]);
return `<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline pathLength="1" class="draw" points="${P.map(x=>x.join(",")).join(" ")}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${P.map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="4.5" fill="var(--vio)"><title>${p[i].toFixed(1)} km/l</title></circle>`).join("")}</svg>`}
function cardC(c){return `<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>${esc(c.id)} · ${esc(c.cat)}</h3>${status(c)}</div><p class="mut">${esc(c.make)} ${esc(c.model)} · ${esc(c.reg)} · ${esc(c.vid)}</p>${timeline(c)}
${c.outcome?`<p><b>Decision:</b> ${c.outcome==="approved"?"Approved":"Rejected"} – ${esc(c.reason)}</p><p><b>Support:</b> ${esc(c.support||"None")}</p>`:""}${c.appt?`<p class="mut">Inspection request: ${esc(c.appt)}</p>`:""}${c.findings?`<p class="mut">Findings: ${esc(c.findings)}</p>`:""}
<button class="btn sm alt" onclick="receipt('${c.id}')">⬇ Receipt</button></div>`}

/* ---------- views ---------- */
const V={
signin(){const a=S.tab==="admin",m=S.mode,T=(k,l,on)=>`<button class="btn sm ${on?"":"alt"}" onclick="${k}">${l}</button>`;
let body;
if(!a)body=`<form style="text-align:left" onsubmit="return signCust(event)"><label>Your name<input name="name" required></label><label>Demo email<input name="email" type="email" placeholder="you@example.com" required></label><button class="btn">Sign in</button><p class="mut" style="margin:0">Demo sign-in, no password. Use fictional details.</p></form>`;
else body=`<div class="tabs">${T("S.mode='in';render()","Sign in",m==="in")}${T("S.mode='up';render()","Request access",m==="up")}${T("S.mode='owner';render()","Owner",m==="owner")}</div>`+
(m==="in"?`<form style="text-align:left" onsubmit="return adminIn(event)"><label>Admin email<input name="email" type="email" required></label><label>Password<input name="pw" type="password" required></label><button class="btn">Sign in as admin</button></form>`:
m==="up"?`<form style="text-align:left" onsubmit="return adminUp(event)"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Choose a password (8+ characters)<input name="pw" type="password" minlength="8" required></label><button class="btn">Send request</button><p class="mut" style="margin:0">The portal owner must approve you before you can sign in.</p></form>`:

/* ---------- actions ---------- */
function regV(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),vid="VEH-"+uid6();save("vehicles",{...f,id:vid,vid,uid:S.uid,created:Date.now()});toast("Registered! Vehicle ID "+vid);confetti();return false}
function fileC(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),v=S.vehicles.find(x=>x.vid===f.vid)||{},id="CMP-"+uid6(),files=[...e.target.files.files].map(x=>x.name).join(", ");
save("complaints",{id,vid:f.vid,reg:v.reg,make:v.make,model:v.model,area:v.area,cat:f.cat,noticed:f.noticed,desc:f.desc,odo:f.odo,insp:f.insp,files,stage:0,history:[{s:"Submitted",t:Date.now()}],uid:S.uid,created:Date.now()});toast("Complaint ID "+id);confetti();location.hash="track";return false}
function appt(i){const c=mine().c.filter(x=>!x.outcome)[0];if(!c){toast(S.me?"File a complaint first":"Sign in and file a complaint first");return}
const d=$("#ad"+i).value||new Date(Date.now()+7*864e5).toISOString().slice(0,10);c.appt=CENTRES[i][0]+" · "+d;c.history=[...(c.history||[]),{s:"Inspection requested",t:Date.now(),note:CENTRES[i][0]}];save("complaints",c);toast("Slot requested for "+d)}
function addFuel(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id="F"+uid6();save("fuel",{id,uid:S.uid,km:+f.km,l:+f.l,eff:f.km/f.l,created:Date.now()});return false}
function tick(i){S.chk[i]=!S.chk[i];try{localStorage.setItem("e20chk",JSON.stringify(S.chk))}catch(e){}render()}
function mcmp(){const b=+$("#mb").value,a=+$("#ma").value;$("#mr").textContent=b>0&&a>0?"Change: "+((a-b)/b*100).toFixed(1)+"% ("+(a<b?"lower":"no drop")+"). Not a diagnosis.":""}
function guide(){const r=$("#gs").value;$("#gr").textContent=r===""?"":"Suggested category: "+CATS[+r]}
function faqf(q){q=q.toLowerCase();document.querySelectorAll("#fq details").forEach(d=>d.style.display=d.textContent.toLowerCase().includes(q)?"":"none")}
function rowf(q){q=q.toLowerCase();document.querySelectorAll(".rw").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none")}
function upd(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),c={...S.complaints.find(x=>x.id===id)};
if(f.outcome&&!f.reason.trim()){toast("A reason is required for a decision");return false}
c.stage=f.outcome?4:+f.stage;Object.assign(c,{findings:f.findings,outcome:f.outcome,reason:f.reason,support:f.support});
c.history=[...(c.history||[]),{s:f.outcome?(f.outcome==="approved"?"Approved":"Rejected"):STAGES[c.stage],t:Date.now(),note:f.reason}];S.sel=null;save("complaints",c);toast("Updated ✅");return false}
function seed(){[["Hatchback X","Kia-demo","Chennai","Reduced mileage"],["Sedan Y","Demo Motors","Pune","Fuel-system concern"],["Hatchback X","Kia-demo","Coimbatore","Reduced mileage"],["SUV Z","Demo Motors","Bengaluru","Engine performance concern"],["Bike Q","Demo Cycles","Chennai","Suspected corrosion"]].forEach((s,i)=>save("complaints",{id:"CMP-S"+uid6(),vid:"VEH-DEMO",reg:"SAMPLE",model:s[0],make:s[1],area:s[2],cat:s[3],desc:"Sample record",odo:"20000",stage:i%4,history:[{s:"Submitted",t:Date.now()}],uid:"sample",created:Date.now()-i}));toast("Sample data added")}
async function save2(name,data){const d=window.claude&&await claude.use("downloads").catch(()=>null);if(!d){toast("Download not available here");return}try{await d.save({filename:name,data})}catch(e){toast("Download cancelled")}}
function exportCSV(){const cols=["id","vid","make","model","area","cat","noticed","odo","insp","stage","outcome","reason","support","findings","desc"],q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
save2("e20-complaints.csv",[cols.join(",")].concat(S.complaints.map(c=>cols.map(k=>q(c[k])).join(","))).join("\n"))}

/* ---------- auth ---------- */
async function hash(email,pw){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("e20:"+email+":"+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const kid=e=>e.replace(/[^a-z0-9]/g,"_");
function signCust(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));setMe({name:f.name.trim(),email:f.email.trim().toLowerCase(),role:"customer"});return false}
function signOwner(){if(!S.owner){toast(S.live?"Access denied: only the page owner or editors":"Still connecting… try again in a moment");return}setMe({name:"Owner",email:"owner@portal.demo",role:"admin",owner:true})}
async function adminUp(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),email=f.email.trim().toLowerCase(),id=kid(email);
if(S.adminApproved.find(x=>x.id===id)){toast("You are already approved – sign in");S.mode="in";render();return false}
await save("adminRequests",{id,name:f.name.trim(),email,hash:await hash(email,f.pw),status:"pending",created:Date.now()});S.mode="in";toast("Request sent! The owner will review it 🕒");render();return false}
async function adminIn(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),email=f.email.trim().toLowerCase(),id=kid(email),a=S.adminApproved.find(x=>x.id===id),r=S.adminRequests.find(x=>x.id===id);
if(!a){toast(r?(r.status==="pending"?"Still waiting for the owner’s approval ⏳":"Your request was "+r.status):"No admin account yet – request access first");return false}
if(a.hash!==await hash(email,f.pw)){toast("Wrong email or password");return false}setMe({name:a.name,email,role:"admin"});return false}
async function apprReq(id){const r=S.adminRequests.find(x=>x.id===id);await save("adminApproved",{id,name:r.name,email:r.email,hash:r.hash,created:Date.now()});await save("adminRequests",{...r,status:"approved"});toast("Approved "+r.name+" 🎉")}
async function rejReq(id){const r=S.adminRequests.find(x=>x.id===id);await save("adminRequests",{...r,status:"rejected"});toast("Rejected")}
async function revoke(id){await del("adminApproved",id);const r=S.adminRequests.find(x=>x.id===id);if(r)await save("adminRequests",{...r,status:"revoked"});toast("Access revoked")}
function setMe(m){S.me=m;S.uid=m.email;try{localStorage.setItem("e20me",JSON.stringify(m))}catch(e){}toast("Hi "+m.name+" 👋");confetti();const n=S.next||(m.role==="admin"?"admin":"home");S.next=null;render.k=null;if(location.hash==="#"+n)render();else location.hash=n}
function signOut(){S.me=null;S.uid="local";try{localStorage.removeItem("e20me")}catch(e){}toast("Signed out. See you! 👋");render.k=null;if(location.hash==="#home")render();else location.hash="home"}
function confetti(){const e=["🎉","💧","🚗","✨","🌿","⛽"];for(let i=0;i<30;i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%6];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2900)}}

/* ---------- render, animation ---------- */
const io="IntersectionObserver"in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08}):null;
function counters(fresh){document.querySelectorAll(".cnt").forEach(el=>{const n=+el.dataset.n;if(!fresh||n===0){el.textContent=n;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
function chrome(){const k=render.cur;
$("#nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===k?"on":""}">${PROT.includes(n[0])&&!(S.me&&(n[0]!=="admin"||S.me.role==="admin"))?"🔒 ":""}${n[1]}</a>`).join("");
$("#who").innerHTML=S.me?`<span class="chip">${S.me.role==="admin"?"🛡":"😎"} ${esc(S.me.name)}</span><button class="btn sm alt" onclick="signOut()">Sign out</button>`:'<a class="btn sm" href="#signin">Sign in</a>';
$("#tg").textContent=curTheme()==="dark"?"☀️":"🌙"}
function render(){const h=(location.hash||"#home").slice(1);let k=V[h]?h:"home";
if(PROT.includes(k)&&!S.me){S.next=k;if(k==="admin")S.tab="admin";k="signin"}
else if(k==="admin"&&S.me.role!=="admin"){S.next="admin";S.tab="admin";k="signin"}
else if(k==="admin"&&!S.me.owner&&S.live&&S.ready&&!S.adminApproved.find(x=>x.id===kid(S.me.email))){signOut();return}
render.cur=k;const key=k+(k==="admin"?S.atab+S.sel:"")+(k==="signin"?S.tab+S.mode:"");
const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$("#app").contains(document.activeElement);
chrome();if(typing&&key===render.k)return;
const fresh=key!==render.k;render.k=key;const app=$("#app"),ov=!fresh&&$("#hv");app.innerHTML=V[k]();if(ov){const nv=$("#hv");if(nv){nv.replaceWith(ov);$("#vm").textContent=ov.muted?"🔇 Sound off":"🔊 Sound on"}}
if(fresh){app.classList.remove("pg");void app.offsetWidth;app.classList.add("pg")}
app.querySelectorAll(".card,h1,.hero").forEach((el,i)=>{if(!io){return}el.classList.add("rv");if(!fresh)el.classList.add("nf");el.style.setProperty("--d",Math.min(i,10)*55+"ms");io.observe(el)});
counters(fresh)}
addEventListener("hashchange",()=>{render.k=null;render();scrollTo(0,0)});
addEventListener("scroll",()=>{const d=document.documentElement,s=d.scrollTop;$("#sp").style.width=(s/Math.max(1,d.scrollHeight-innerHeight)*100)+"%";$("#hd").classList.toggle("sc",s>10);$("#up").classList.toggle("on",s>450)},{passive:true});
function vmute(){const v=$("#hv");v.muted=!v.muted;if(!v.muted)v.play().catch(()=>{});$("#vm").textContent=v.muted?"🔇 Sound off":"🔊 Sound on"}
/* click sound on tabs and buttons */
let AC=null;function tick2(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(380,t+.07);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.1)}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('nav a,.tabs button,.side button,.tg,#who a,#who button'))tick2()},true);
boot();
</script></body></html>
